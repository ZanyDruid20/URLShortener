version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: shortener
      MYSQL_USER: shortuser
      MYSQL_PASSWORD: shortpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  urlshortener:
    build: .
    ports:
      - "9808:9808"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - DATABASE_URL=shortuser:shortpass@tcp(mysql:3306)/shortener